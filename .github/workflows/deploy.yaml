name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Cache Quartz plugins
      uses: actions/cache@v5
      with:
        path: .quartz/plugins
        key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-plugins-

    - name: Install dependencies
      run: npm ci

    - name: Install Quartz plugins
      run: npx quartz plugin install
    
    - name: Build Quartz site
      run: npx quartz build --directory Siebenlande -v
    
    - name: Copy .htaccess to public directory
      run: cp .htaccess public/.htaccess
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.REMOTE_PORT || 22 }}
        script: |
          # Navigate to siebenlande subdirectory and clean it
          cd siebenlande
          find . -mindepth 1 -delete
    
    - name: Upload files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.REMOTE_PORT || 22 }}
        source: "public/*"
        target: "./siebenlande/"
        strip_components: 1
